services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    volumes:
      - ./backend:/app
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      # Reach the backend service by name; localhost is this container.
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
      # Keep the image's node_modules; the bind mount above would hide them.
      - /app/node_modules
    depends_on:
      - backend

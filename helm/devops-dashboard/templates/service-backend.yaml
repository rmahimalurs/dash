apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-dashboard.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "devops-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "devops-dashboard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http

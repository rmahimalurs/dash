apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-dashboard
  namespace: devops-dashboard
  labels:
    app: devops-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-dashboard
  template:
    metadata:
      labels:
        app: devops-dashboard
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - devops-dashboard
                topologyKey: kubernetes.io/hostname
      serviceAccountName: devops-dashboard
      containers:
        - name: devops-dashboard
          image: 116248235601.dkr.ecr.us-east-1.amazonaws.com/devops-dashboard:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: devops-dashboard-config
            - secretRef:
                name: devops-dashboard-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/dashboard/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/dashboard/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: profile-storage
              mountPath: /data
      volumes:
        - name: profile-storage
          emptyDir: {}

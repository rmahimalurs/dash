apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-dashboard
  namespace: devops-dashboard
  labels:
    app: devops-dashboard
# No annotations needed for EKS Pod Identity.
# The IAM role association is created at the EKS level:
#
#   aws eks create-pod-identity-association \
#     --cluster-name <cluster-name> \
#     --namespace devops-dashboard \
#     --service-account devops-dashboard \
#     --role-arn arn:aws:iam::<account-id>:role/devops-dashboard-pod-identity
#
# Required IAM policy for the attached role:
#   {
#     "Version": "2012-10-17",
#     "Statement": [{
#       "Effect": "Allow",
#       "Action": ["ec2:DescribeImages"],
#       "Resource": "*"
#     }]
#   }
#
# Required trust policy for the attached role:
#   {
#     "Version": "2012-10-17",
#     "Principal": { "Service": "pods.eks.amazonaws.com" },
#     "Action": ["sts:AssumeRole", "sts:TagSession"]
#   }
